name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.0.2
        cache-read-only: false 
        # Caching seems to be causing issues with GitHub Actions currently, 
        # so we rely on setup-gradle's default behavior but acknowledge the instability.
        # If it fails again, we might need to disable caching explicitly if possible, 
        # though setup-gradle enables it by default.
        # Let's try to update the build command to be more verbose to see the REAL error
        # because "Process completed with exit code 1" hides the actual compilation error.

    - name: Build with Gradle
      run: |
        gradle clean
        gradle assembleDebug --no-daemon --stacktrace --info

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
